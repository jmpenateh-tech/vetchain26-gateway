name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: "3000"
      NODE_ENV: production
      JWT_SECRET: ci-secret-not-for-production
      CORS_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: |
          set -e
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done
      - name: Build image
        run: docker build -t ci-service .
      - name: Smoke test
        run: |
          set -e
          docker run -d --name ci-service --network host \
            -e PORT="$PORT" -e NODE_ENV="$NODE_ENV" \
            -e JWT_SECRET="$JWT_SECRET" -e CORS_ORIGIN="$CORS_ORIGIN" \
            ci-service
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/" | grep -q '"service":"api-gateway"'; then
              echo "gateway OK"; exit 0
            fi
            sleep 2
          done
          echo "::error::el gateway no respondio en 60s"
          docker logs ci-service
          exit 1